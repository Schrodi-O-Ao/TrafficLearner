services:
  - type: web
    name: traffic-learner-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-web.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://schrodi-o-ao.github.io
